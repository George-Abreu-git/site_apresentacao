# Integração contínua (CI) do site — T-006.
#
# O que é: a cada push ou pull request para a `main`, o GitHub sobe uma máquina
# Linux limpa, baixa o repositório e roda as mesmas verificações que rodamos
# localmente. Se alguma falhar, o "check" fica vermelho no GitHub.
#
# Ordem das etapas (do mais rápido ao mais lento, para falhar cedo):
#   validador da estrutura → instalar dependências → lint → build (tipos)
#   → testes unitários → navegador do Playwright → testes de aceitação (e2e).
# O validador vem primeiro porque só precisa do Python e do código baixado:
# se a estrutura estiver quebrada, o CI falha antes de instalar os pacotes.
#
# Para reproduzir localmente, rode na raiz, nesta mesma ordem:
#   python3 scripts/validar_estrutura.py
#   npm ci
#   npm run lint
#   npm run build
#   npm test
#   npx playwright install --with-deps chromium
#   npm run test:e2e
#
# Segredos: nenhum. O CI não precisa de token; se um dia precisar, ele entra
# como "secret" do repositório (Settings → Secrets), nunca neste arquivo.

# Nome que aparece na aba "Actions" e nos checks do pull request.
name: CI

# Gatilhos: quando o workflow roda.
on:
  # Todo push direto na main (inclusive o merge local + `git push origin main`).
  push:
    branches: [main]
  # Todo pull request que tenha a main como destino.
  pull_request:
    branches: [main]

# Permissão mínima do token automático do GitHub: só ler o código.
# O CI não escreve nada no repositório.
permissions:
  contents: read

# Concorrência: no máximo uma execução por branch ou pull request.
# `group` junta as execuções da mesma referência (`github.ref` é, por exemplo,
# refs/heads/main num push ou refs/pull/12/merge num pull request). Com
# `cancel-in-progress: true`, um push novo cancela a execução antiga ainda em
# andamento do mesmo grupo: só o commit mais recente importa, e assim não se
# gastam os minutos gratuitos do repositório privado com resultados que ninguém
# vai olhar.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Um único job: as etapas rodam em sequência, na mesma máquina.
  verificar:
    name: Validador, lint, build e testes
    # Máquina virtual Linux mantida pelo GitHub (já vem com git e python3).
    runs-on: ubuntu-latest
    # Se algo travar (ex.: servidor do e2e que não sobe), cancela em 15 min
    # em vez de gastar os minutos gratuitos do repositório privado.
    timeout-minutes: 15

    steps:
      # 1. Baixa o código do commit que disparou o workflow.
      - name: Baixar o código
        uses: actions/checkout@v7

      # 2. Confere a estrutura do projeto (pastas, docs, skills, agentes e
      #    comandos). Script em Python, só com a biblioteca padrão: não precisa
      #    do Node nem do node_modules (o python3 já vem na máquina do GitHub).
      #    Por isso roda antes de instalar qualquer coisa.
      - name: Validar a estrutura do projeto
        run: python3 scripts/validar_estrutura.py

      # 3. Instala o Node.js 24 (o mínimo pedido em "engines" no package.json).
      #    `cache: npm` guarda a pasta de downloads do npm (~/.npm) entre
      #    execuções, usando o package-lock.json como chave: enquanto o lock não
      #    muda, os pacotes vêm do cache em vez da internet.
      - name: Instalar o Node.js 24 (com cache do npm)
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      # 4. Instala as dependências de todos os workspaces (apps/* e packages/*).
      #    `npm ci` (e não `npm install`) segue exatamente o package-lock.json e
      #    falha se ele estiver desatualizado: instalação reprodutível.
      - name: Instalar dependências
        run: npm ci

      # 5. Lint: o ESLint (configuração única em eslint.config.mjs, ADR-0002)
      #    analisa cada workspace e também e2e/ e scripts/.
      - name: Lint
        run: npm run lint

      # 6. Build de todos os workspaces. Ele roda o `tsc` (o compilador do
      #    TypeScript), que confere os tipos: pega erros que o lint e os testes
      #    não veem, porque o Vitest só transpila (não checa tipos) e o lint não
      #    usa informação de tipos. Inclui a prova de que front e API
      #    compartilham o tipo `Projeto` (`expectTypeOf`, T-005), que só falha
      #    aqui. Também confirma que front e API compilam para produção.
      - name: Build (checagem de tipos)
        run: npm run build

      # 7. Testes unitários (Vitest) e de rotas da API (Supertest) de todos os
      #    workspaces. Eles não dependem da etapa de build: o pacote shared só
      #    é importado como tipo (`import type`), que some ao transpilar.
      - name: Testes unitários e da API
        run: npm test

      # 8. Baixa o Chromium usado pelo Playwright e, com `--with-deps`, as
      #    bibliotecas do Linux de que ele precisa. Só o Chromium: os dois
      #    projetos do e2e (celular e desktop) usam esse navegador.
      - name: Instalar o navegador do Playwright
        run: npx playwright install --with-deps chromium

      # 9. Testes de aceitação no navegador. A config (e2e/playwright.config.ts)
      #    sobe o front sozinha e, como o GitHub define CI=true, proíbe
      #    `test.only` esquecido e repete até 2 vezes um teste instável.
      - name: Testes de aceitação (e2e)
        run: npm run test:e2e

      # 10. Só se algo falhou: guarda o relatório do Playwright (com capturas e
      #     rastro) para baixar na página da execução. Fica disponível 7 dias.
      - name: Guardar o relatório do Playwright (se falhar)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: relatorio-playwright
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7
          if-no-files-found: ignore
